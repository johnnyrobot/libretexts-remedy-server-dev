# One maintained artifact package; optional Scanner and Bridge overlays.
# Never build/substitute images in the deployment command. See README.md.
services:
  remedy-server:
    image: ${REMEDY_SERVER_IMAGE:?load the verified exact OCI candidate first}
    init: true
    read_only: true
    restart: unless-stopped
    cpus: 4
    mem_limit: 4g
    pids_limit: 512
    shm_size: 256m
    stop_grace_period: 120s
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=${REMEDY_SERVER_SECCOMP_FILE:?absolute reviewed profile path required}
    tmpfs: ["/tmp:rw,nosuid,nodev,size=512m"]
    env_file: [./env/remedy-server.env]
    environment:
      CXONE_INTEGRATION_ENABLED: 'false'
    entrypoint: [node, /opt/remedy-bundle/secret-env.mjs, server]
    command: [uvicorn, backend.app.main:app, --host, 0.0.0.0, --port, '8000', --workers, '1', --timeout-graceful-shutdown, '15']
    configs:
      - source: credential-loader
        target: /opt/remedy-bundle/secret-env.mjs
    ports: ["127.0.0.1:${REMEDY_SERVER_PORT:-8090}:8000"]
    volumes:
      - type: bind
        source: ${REMEDY_STATE_ROOT:?pre-provisioned bounded local POSIX store required}
        target: /app/state
        bind: {create_host_path: false}
      - type: bind
        source: ${REMEDY_SECRET_ROOT:?private per-role credential directories required}/server
        target: /run/secrets
        read_only: true
        bind: {create_host_path: false}
    networks: [remedy]
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:8000/readyz]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
configs:
  credential-loader:
    file: ./secret-env.mjs
networks:
  remedy:
    internal: true
